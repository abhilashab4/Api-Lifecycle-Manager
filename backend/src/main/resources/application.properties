```properties
spring.application.name=api-lifecycle-manager

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apilifecycle}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html

demo.api-keys.order-service=${ORDER_API_KEY}
demo.api-keys.reporting-service=${REPORTING_API_KEY}
demo.api-keys.payment-service=${PAYMENT_API_KEY}

server.error.include-message=never
```